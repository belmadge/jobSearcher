name: JobSearcher Daily Search

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./...

      - name: Run daily search
        run: go run ./cmd/jobsearch run

      - name: Commit reports
        run: |
          if git diff --quiet -- reports data; then
            echo "No report/database changes."
            exit 0
          fi
          git config user.name "JobSearcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data
          git commit -m "chore: update daily job search"
          git push
